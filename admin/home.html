<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard - Parking System</title>
  <link rel="stylesheet" href="home.css" />
</head>
<body>
  <header>
    <h1>Parking System Admin Dashboard</h1>
  </header>

  <div id="sidebar" class="sidebar">
    <nav>
      <ul>
        <li><a href="/admin/home.html" title="Dashboard"><span class="icon">🏠</span><span class="text">Dashboard</span></a></li>
        <li><a href="/admin/staff/staff.html" title="Staff"><span class="icon">👥</span><span class="text">Staff</span></a></li>
        <li><a href="/admin/admins/admin.html" title="Admin"><span class="icon">🔐</span><span class="text">Admin</span></a></li>
        <li><a href="/admin/reports/report.html" title="Reports"><span class="icon">📊</span><span class="text">Reports</span></a></li>
        <li><a href="/admin/settings/settings.html" title="Settings"><span class="icon">⚙</span><span class="text">Settings</span></a></li>
        <li><a href="/admin/history/history.html" title="History"><span class="icon">📜</span><span class="text">History</span></a></li>
        <li><a href="/admin/about/about.html" title="About"><span class="icon">ℹ</span><span class="text">About</span></a></li>
        <li><a href="#" onclick="logout()" title="Logout"><span class="icon">🚪</span><span class="text">Logout</span></a></li>
      </ul>
    </nav>
  </div>

  <section class="stats">
    <div class="stat-box">
      <h2 id="totalSlots">0</h2>
      <p>Total Slots</p>
    </div>
    <div class="stat-box">
      <h2 id="occupiedSlots">0</h2>
      <p>Occupied Slots</p>
    </div>
    <div class="stat-box">
      <h2 id="freeSlots">0</h2>
      <p>Free Slots</p>
    </div>
  </section>

  <section>
    <h2>Current Parked Vehicles</h2>
    <table>
      <thead>
        <tr>
          <th>Slot Name</th>
          <th>Vehicle Number</th>
          <th>Entry Time</th>
        </tr>
      </thead>
      <tbody id="vehicleList">
        <!-- Dynamic rows here -->
      </tbody>
    </table>
  </section>

  <button class="logout-btn" onclick="logout()">Logout</button>

  <script src="home.js" defer></script>
  
  <script>
    function logout() {
      window.location.href = "/index.html";
    }
  </script>
</body>
</html>
