<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>

  <div id="sidebar" class="sidebar">
    <nav>
      <ul>
        <li><a href="/admin/home.html" title="Dashboard"><span class="icon"></span><span class="text">Dashboard</span></a></li>
        <li><a href="/admin/staff/staff.html" title="Staff"><span class="icon"></span><span class="text">Staff</span></a></li>
        <li><a href="/admin/admins/admin.html" title="Admin"><span class="icon"></span><span class="text">Admin</span></a></li>
        <li><a href="/admin/reports/report.html" title="Reports"><span class="icon"></span><span class="text">Reports</span></a></li>
        <li><a href="/admin/settings/settings.html" title="Settings"><span class="icon"></span><span class="text">Settings</span></a></li>
        <li><a href="/admin/history/history.html" title="History"><span class="icon"></span><span class="text">History</span></a></li>
        <li><a href="/admin/about/about.html" title="About"><span class="icon"></span><span class="text">About</span></a></li>
        <li><a href="#" onclick="logout()" title="Logout"><span class="icon"></span><span class="text">Logout</span></a></li>
      </ul>
    </nav>
  </div>

  <main class="container">
    <h1>Parking Amount Settings</h1>

    <form id="settingsForm">
      <div class="form-row">
        <label for="perHourMoney">Per Hour Money (Rs):</label>
        <input type="number" id="perHourMoney" name="perHourMoney" min="0" required />
      </div>

      <div class="form-row">
        <label for="initialMoney">Initial Money (Rs):</label>
        <input type="number" id="initialMoney" name="initialMoney" min="0" required />
      </div>

      <div class="form-row">
        <label for="initialMoneyTime">Initial Money Time (hours):</label>
        <input type="number" id="initialMoneyTime" name="initialMoneyTime" min="0" required />
      </div>

      <button type="submit" id="updateSettingsBtn">Update Settings</button>
    </form>

    <p id="message" class="message"></p>
  </main>

  <script src="settings.js" defer></script>
  <script>
    function logout() {
      window.location.href = "/index.html";
    }
  </script>
</body>
</html>
