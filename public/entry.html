<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entry - Smart Parking</title>
    <link rel="stylesheet" href="entry.css">
    <!-- ✅ QR CODE CDN -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚗 Entry Station</h1>
            <button id="toggleMode" class="mode-btn">📋 Manual Mode</button>
            <button id="logoutBtn">🚪 Logout</button>
        </header>

        <!-- AUTO MODE (Default) -->
        <div id="autoMode" class="mode active">
            <div class="input-group">
                <input type="text" id="vehicleNumber" placeholder="VEHICLE NUMBER" maxlength="15">
                <button id="autoAllocateBtn"> Auto Allocate</button>
            </div>
            <div id="message" class="message"></div>
        </div>

        <!-- MANUAL MODE (Hidden by default) -->
        <div id="manualMode" class="mode" style="display: none;">
            <h3>📋 Manual Slot Selection</h3>
            <div id="slotGrid" class="slot-grid"></div>
            <div class="input-group">
                <input type="text" id="manualVehicleNumber" placeholder="Vehicle No" maxlength="15">
                <button id="manualBookBtn" disabled> Book Slot</button>
            </div>
            <div id="manualMessage" class="message"></div>
        </div>
    <!-- Add this BILL MODAL to your entry.html -->
<div id="billModal" class="modal" style="display: none;">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h2>🧾 Parking Receipt</h2>
    <div class="bill-details">
      <p><strong>Slot:</strong> <span id="billSlot">-</span></p>
      <p><strong>Vehicle:</strong> <span id="billVehicle">-</span></p>
      <p><strong>Date:</strong> <span id="billDate">-</span></p>
      <p><strong>Entry:</strong> <span id="billEntryTime">-</span></p>
      <div id="qrCode" class="qr-container"></div>
    </div>
    <button id="printBill" class="print-btn">Print Receipt</button>
  </div>
</div>
    <script src="script.js"></script>
</body>
</html>
